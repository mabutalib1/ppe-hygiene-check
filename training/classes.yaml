# The 5 detector classes. Spell them exactly like this in Roboflow.
# Hairnet was dropped (docs/decisions.md #8): hairnet labels in public data are ignored.
names:
  - person
  - mask
  - no_mask
  - gloves
  - no_gloves

# Public-dataset label (lowercased) -> our class. Anything not listed is dropped.
# Only add a mapping if the public class MEANS the same as ours.
aliases:
  person: person
  human: person
  worker: person
  mask: mask
  correct_mask: mask
  "correct mask": mask
  no_mask: no_mask
  no-mask: no_mask
  incorrect_mask: no_mask       # mask under the nose counts as no_mask
  with_mask: mask
  without_mask: no_mask
  mask_weared_incorrect: no_mask
  mask_weared_incorrectly: no_mask
  mask_worn_incorrectly: no_mask
  glove: gloves
  gloves: gloves
  gloved_hand: gloves
  no_glove: no_gloves
  no_gloves: no_gloves
  no-gloves: no_gloves
  bare_hand: no_gloves
  bare-hand: no_gloves
  gloved: gloves                # Gloves Annotated Dataset (Sana Ali)
  not-gloved: no_gloves
  maskon: mask                  # mhm kitchen
  maskoff: no_mask
  mask_absent: no_mask          # IDP FinalDataset-Version2
  mask_incomplete: no_mask      # mask not covering nose and mouth
  gloves_absent: no_gloves
  # Deliberately NOT mapped (dropped):
  #   hairnet, no_hairnet and their spellings: hairnet is not checked (decisions.md #8)
  #   without_mask_hairnet  (Tata Meta) one box for two items, can't be split
